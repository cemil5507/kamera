    var head = [].slice.call(d.head.childNodes).filter(function (n) { return n.nodeName !== 'SCRIPT'; }).map(function (n) { return document.importNode(n, true); });
    document.head.replaceChildren.apply(document.head, head);
    document.body.className = d.body.className; document.body.removeAttribute('style');
    var scripts = [];
    var nodes = [].slice.call(d.body.childNodes).filter(function (n) { if (n.nodeName === 'SCRIPT') { scripts.push(n.textContent); return false; } return true; })
      .map(function (n) { return document.importNode(n, true); });
    document.body.replaceChildren.apply(document.body, nodes);
    scripts.forEach(function (t) { var s = document.createElement('script'); s.textContent = t; document.body.appendChild(s); });
  }
  function decrypt(key) {
    return subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function fromPass(pw) {
    return subtle.importKey('raw', new TextEncoder().encode(norm(pw)), 'PBKDF2', false, ['deriveKey'])
      .then(function (km) { return subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']); });
  }
  function remember(key) {
    return subtle.exportKey('jwk', key).then(function (j) { try { localStorage.setItem(KEY, JSON.stringify({ sid: P.sid, k: j.k })); } catch (e) {} }).catch(function () {});
  }
  // Önceden hatırlanan anahtar varsa şifre sormadan aç
  var saved = null; try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (subtle && saved && saved.sid === P.sid) {
    $('f').style.visibility = 'hidden';
    subtle.importKey('jwk', { kty: 'oct', k: saved.k, alg: 'A256GCM', ext: true }, { name: 'AES-GCM' }, false, ['decrypt'])
      .then(decrypt).then(run)
      .catch(function () { try { localStorage.removeItem(KEY); } catch (e) {} $('f').style.visibility = 'visible'; });
  }
  $('f').addEventListener('submit', function (e) {
    e.preventDefault(); if (!subtle) return;
    var pw = $('pw').value; if (!pw) return;
    $('ok').disabled = true; say('Kontrol ediliyor…');
    fromPass(pw).then(function (key) {
      return decrypt(key).then(function (html) {
        var done = function () { run(html); };
        if ($('rem').checked) remember(key).then(done); else { try { localStorage.removeItem(KEY); } catch (e) {} done(); }
      });
    }).catch(function () { say('Şifre yanlış'); $('ok').disabled = false; $('pw').select(); });
  });
})();
</script>
