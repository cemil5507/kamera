<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saha Kamera">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Saha Kamera</title>
<style>
:root{--g:#00f51a;--bg:#000;--panel:#16181a;--line:#2a2d30;--tx:#f2f2f2;--mut:#9aa0a6;--blue:#1e88e5;--yel:#ffd60a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#head{flex:none}
#strip{display:block;width:100%;height:58px}
#bar{height:30px;background:var(--g);color:#000;display:flex;align-items:center;gap:8px;padding:0 10px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden}
#bar .sp{flex:1}
#bar small{font-weight:600;font-size:12px}
#calib{display:none;position:absolute;right:8px;top:36px;font-size:10px;font-weight:700;color:#ff9f0a}
#stage{position:relative;flex:none;margin:0 auto;width:min(calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right)),calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 88px) * var(--rp,.75)));aspect-ratio:var(--rp,.75);background:#080808;overflow:hidden;touch-action:none}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#tagbtn{position:absolute;left:8px;top:8px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
#tagbtn svg{width:20px;height:20px;fill:#fff}
#focus{position:absolute;width:70px;height:70px;border:1.5px solid var(--yel);border-radius:4px;display:none;pointer-events:none;transform:translate(-50%,-50%)}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.78);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:700;display:none;max-width:92%;text-align:center;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
#ctl{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px env(safe-area-inset-right) calc(10px + env(safe-area-inset-bottom)) env(safe-area-inset-left);background:linear-gradient(transparent,rgba(0,0,0,.6) 45%);pointer-events:none}
#ctl>*{pointer-events:auto}
#arbtn{position:absolute;right:8px;top:8px;height:34px;padding:0 12px;border-radius:99px;background:rgba(0,0,0,.45);font-weight:700;font-size:13px}
#zoomrow{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:99px}
#zoomrow button{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);font-weight:700;font-size:13px}
#zoomrow button.on{color:var(--yel)}
#zoomrow button:disabled{opacity:.35}
#modes{display:flex;gap:44px;font-size:19px;font-weight:700}
#modes button{font-weight:700;font-size:inherit;padding:6px 4px}
#modes .on{color:var(--yel)}
#modes .off{color:#8a8a8a}
#shutter.vid i{background:#e53935}
#shutter.rec i{width:30px;height:30px;border-radius:7px;background:#e53935}
#recchip{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(210,0,0,.88);padding:5px 12px;border-radius:99px;font-weight:700;font-size:13px;display:none;pointer-events:none}
#row{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 26px}
#galbtn,#setbtn{width:48px;height:48px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.12);overflow:hidden}
#setbtn{background:none}
#galbtn img{width:100%;height:100%;object-fit:cover}
#galbtn svg,#setbtn svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.7}
#shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
#shutter i{width:58px;height:58px;border-radius:50%;background:#fff;transition:transform .08s}
#shutter:active i{transform:scale(.88)}

/* Yatay tutuş: kamera ekranı kaplar (iPhone gibi), pusula üstte, düğmeler sağda */
@media (orientation:landscape){
  #app{display:block;padding:0}
  #head{position:absolute;z-index:5;top:env(safe-area-inset-top);left:env(safe-area-inset-left);right:calc(132px + env(safe-area-inset-right));background:linear-gradient(rgba(0,0,0,.45),transparent)}
  #stage{position:absolute;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:50%;transform:translateX(-50%);margin:0;aspect-ratio:auto;
    width:min(calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right)),calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * var(--rl,1.3333)))}
  #ctl{top:0;bottom:0;left:auto;right:0;width:calc(132px + env(safe-area-inset-right));justify-content:center;gap:8px;padding:6px env(safe-area-inset-right) 6px 0;background:linear-gradient(to left,rgba(0,0,0,.55),transparent)}
  #zoomrow{flex-direction:column;border-radius:26px;padding:6px 4px;gap:5px}
  #zoomrow button{width:30px;height:30px;font-size:11px}
  #row{flex-direction:column;gap:8px;padding:0}
  #galbtn,#setbtn{width:40px;height:40px}
  #shutter{width:64px;height:64px}
  #shutter i{width:50px;height:50px}
  #modes{gap:10px;font-size:15px}
  #tagbtn,#arbtn,#toast,#recchip{top:96px}
}

/* Başlangıç ekranı */
#start{position:fixed;inset:0;z-index:50;background:#0b0c0d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#start img{width:96px;height:96px;border-radius:22px}
#start h1{margin:0;font-size:26px}
#start p{margin:0;color:var(--mut);max-width:34ch}
#start button.go{background:var(--g);color:#000;font-weight:800;font-size:18px;padding:14px 34px;border-radius:14px}
#start .err{color:#ff9f0a;font-size:13px;min-height:1.3em}

/* Paneller */
.sheet{position:fixed;inset:0;z-index:30;background:var(--panel);display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{display:flex}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
.sh-head button{color:var(--blue);font-weight:600}
.sh-body{flex:1;overflow:auto;padding:14px 16px 30px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
.tabs button{flex:none;padding:7px 13px;border-radius:99px;background:#2a2d30;font-weight:600;font-size:13px}
.tabs button.on{background:var(--blue)}
.f{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.f>label,.f>.lb{font-size:13px;color:var(--mut)}
.f select,.f input[type=text]{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#0e0f10;color:var(--tx);font:inherit}
.f input[type=range]{width:100%}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.tg input{width:46px;height:28px;accent-color:var(--g)}
.note{font-size:12px;color:var(--mut);margin:-8px 0 16px}
h3{margin:18px 0 8px;font-size:14px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;background:#2a2d30;font-weight:700;font-size:14px}
.pill.on{background:var(--blue)}
.pill b{opacity:.65;font-weight:700;padding-left:4px}
.pill.add{background:none;border:1px dashed #666;color:var(--mut)}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.sw button{width:34px;height:34px;border-radius:50%;border:1px solid #666}
.sw button.on{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:inline-block;background:var(--blue);padding:10px 16px;border-radius:10px;font-weight:700}
.btn.red{background:#c62828}
.btn.gray{background:#2a2d30}
.logoprev{display:flex;align-items:center;gap:12px;margin-top:8px}
.logoprev img{height:44px;max-width:50%;background:#fff;border-radius:4px}

/* Galeri */
.crumbs{padding:10px 16px;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs button{color:var(--blue);font-weight:600;padding:6px 4px;cursor:pointer}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
button.item{width:100%;text-align:left;color:inherit;font:inherit;background:none}
.item .ic{width:56px;height:56px;border-radius:8px;background:#2a2d30;display:grid;place-items:center;overflow:hidden;flex:none;font-size:26px}
.item img{width:100%;height:100%;object-fit:cover}
.item .nm{flex:1;min-width:0;word-break:break-all;font-size:13px}
.item .nm small{display:block;color:var(--mut)}
.item .x{color:#ff6b6b;padding:8px}
.acts{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#viewer{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column}
#viewer.open{display:flex}
#viewer img,#viewer video{flex:1;min-height:0;object-fit:contain;width:100%;background:#000}
#viewer video{display:none}
#viewer .vb{display:flex;gap:10px;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
</style>
</head>

    </div>

</div>

<div id="start">
  <img src="icon.png" alt="">
  <h1>Saha Kamera</h1>
  <p>Başlamak için kamera, konum ve pusula izinlerini vermen gerekiyor.</p>

<script>
// Sıkıştırmasız (store) zip yazıcı. Ek kütüphane gerekmez. Türkçe dosya adları için UTF-8 bayrağı açık.
(function (root) {
  const crcT = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(u8) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = crcT[(c ^ u8[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // entries: [{name: "klasor/dosya.jpg", blob: Blob}]
  async function makeZip(entries) {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let off = 0;
    const d = new Date();
    const dt = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const dd = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

    for (const e of entries) {
      const data = new Uint8Array(await e.blob.arrayBuffer());
      const nm = enc.encode(e.name);
      const crc = crc32(data);

      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true);
      lh.setUint16(10, dt, true);
      lh.setUint16(12, dd, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true);
      lh.setUint32(22, data.length, true);
      lh.setUint16(26, nm.length, true);
      lh.setUint16(28, 0, true);
      parts.push(lh.buffer, nm, data);

      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, dt, true);
      ch.setUint16(14, dd, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true);
      ch.setUint32(24, data.length, true);
      ch.setUint16(28, nm.length, true);
      ch.setUint32(42, off, true);
      central.push(ch.buffer, nm);

      off += 30 + nm.length + data.length;
    }

    const csize = central.reduce((a, b) => a + b.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, entries.length, true);
    end.setUint16(10, entries.length, true);
    end.setUint32(12, csize, true);
    end.setUint32(16, off, true);
    return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
  }

  root.makeZip = makeZip;
  if (typeof module !== 'undefined') module.exports = { makeZip, crc32 };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
'use strict';
/* ============ Yardımcılar ============ */
const $ = s => document.querySelector(s);
const el = (t, p = {}, kids = []) => { const e = document.createElement(t); Object.assign(e, p); kids.forEach(k => e.append(k)); return e; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, '0');
const sanitize = s => String(s).replace(/[\/\\:]/g, '-').trim();

/* ============ Ayarlar ============ */
const DEF = {
  siteID: 'KBGTI', sectors: ['SEKTÖR-1', 'SEKTÖR-2'], sector: 'SEKTÖR-1', showSector: true,
  tags: ['Montaj Seri No', 'Söküm Seri No', 'Vinç'], activeTags: ['Montaj Seri No'],
  pos: 'br', margin: 0, bar: false,
  logo: null, logoPos: 'tr', logoScale: 0.18, logoOp: 0.9,
  font: 'Arial, Helvetica, sans-serif', size: 'small', bold: true,
  color: '#00FF1A', bg: '#000000', bgOp: 0.87, txOp: 0.70,
  time: true, coords: true, coordFmt: 'dms', addr: true, street: true, district: true, city: false, country: true,
  sid: true, heading: false, compassPhoto: true, wide: true, aspect: '4:3', fsz: 0.018, dual: true, quality: 0.95, sectorInName: true
};
let S = (() => {
  try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem('saha.settings.v1') || '{}')); }
  catch (e) { return Object.assign({}, DEF); }
})();
function save() { try { localStorage.setItem('saha.settings.v1', JSON.stringify(S)); } catch (e) {} applyAspect(); drawOverlay(); updateBar(); }

const POS = { tl: 'Sol üst', tc: 'Üst orta', tr: 'Sağ üst', bl: 'Sol alt', bc: 'Alt orta', br: 'Sağ alt' };
const FONTS = [['Arial', 'Arial, Helvetica, sans-serif'], ['Helvetica Neue', '"Helvetica Neue", Helvetica, sans-serif'], ['Verdana', 'Verdana, sans-serif'],
  ['Georgia', 'Georgia, serif'], ['Courier New', '"Courier New", monospace'], ['Menlo', 'Menlo, monospace'], ['Sistem', 'system-ui, sans-serif']];
const ASP = { '4:3': [4, 3], '16:9': [16, 9], '1:1': [1, 1] };
function applyAspect() {
  const [l, sh] = ASP[S.aspect] || ASP['4:3'], st = document.documentElement.style;
  st.setProperty('--rp', sh / l); st.setProperty('--rl', l / sh);
  const b = document.getElementById('arbtn'); if (b) b.textContent = S.aspect;
}
const SIZES = { tiny: ['Çok küçük', 0.014], small: ['Küçük', 0.018], middle: ['Orta', 0.024], large: ['Büyük', 0.032] };
const PALETTE = ['#00FF1A', '#FFFFFF', '#FFD60A', '#FF9F0A', '#1E88E5', '#2F4BFF', '#4DA3C7', '#FF453A', '#1C1C1E', '#000000'];

/* ============ Konum / adres ============ */
const G = { lat: null, lon: null, acc: null, alt: null, addr: { street: '', district: '', city: '', country: '' }, lastGeo: null, lastGeoT: 0, busy: false };

let geoOn = false;
function startGeo() {
  if (!navigator.geolocation || geoOn) return;
  geoOn = true;
  navigator.geolocation.watchPosition(p => {
    G.lat = p.coords.latitude; G.lon = p.coords.longitude; G.acc = p.coords.accuracy; G.alt = p.coords.altitude;
    updateBar(); drawOverlay(); geocode();
  }, () => {}, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}
function dist(a, b, c, d) {
  const R = 6371000, r = Math.PI / 180, dLa = (c - a) * r, dLo = (d - b) * r;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
async function geocode() {
  if (G.busy || G.lat == null) return;
  const now = Date.now();
  if (now - G.lastGeoT < 10000) return;
  const moved = G.lastGeo ? dist(G.lastGeo[0], G.lastGeo[1], G.lat, G.lon) : Infinity;
  const empty = !G.addr.street && !G.addr.city;
  if (!(moved > 25 || now - G.lastGeoT > 120000 || empty)) return;
  G.busy = true; G.lastGeoT = now; G.lastGeo = [G.lat, G.lon];

const vid = $('#vid');

async function openCamera(deviceId) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const video = deviceId
    ? { deviceId: { exact: deviceId }, width: { ideal: 4032 }, height: { ideal: 3024 } }
    : { facingMode: { ideal: 'environment' }, width: { ideal: 4032 }, height: { ideal: 3024 } };
  stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
  track = stream.getVideoTracks()[0];
  vid.srcObject = stream;
  await vid.play().catch(() => {});
  const caps = track.getCapabilities ? track.getCapabilities() : {};

}

    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    devs.forEach(d => {
      const l = (d.label || '').toLowerCase();
      if (/ultra|geniş açı/.test(l)) lenses.ultra = d.deviceId;
      else if (/tele/.test(l)) lenses.tele = d.deviceId;

}

    track.applyConstraints({ advanced: [{ zoom: v }] }).catch(() => {});

  } else {

  }

}

  if (rec) { toast('Kayıt sırasında lens değişmez'); return; }
  if (name !== lens) {
    const id = lenses[name];
    if (!id) return applyZoom(z);
    try { await openCamera(id); lens = name; } catch (e) { toast('Bu lens açılamadı'); return; }
  }
  applyZoom(z);
}

  const box = $('#zoomrow'); box.innerHTML = '';
  const btn = (txt, on, fn, dis) => { const b = el('button', { textContent: txt, disabled: !!dis }); if (on) b.classList.add('on'); b.onclick = fn; box.append(b); };
  btn(torchOn ? '⚡' : '🔦', torchOn, toggleTorch, !torchOK);
  if (lenses.ultra) btn(lens === 'ultra' ? '0.5×' : '0.5', lens === 'ultra', () => setLens('ultra', 1));

let db = null;
function openDB() {
  return new Promise((res, rej) => {
    const q = indexedDB.open('saha-kamera', 1);
    q.onupgradeneeded = () => { q.result.createObjectStore('files', { keyPath: 'id', autoIncrement: true }).createIndex('dir', 'dir'); };
    q.onsuccess = () => { db = q.result; res(); };

}
const tx = (mode) => db.transaction('files', mode).objectStore('files');
const dbAll = () => new Promise((res, rej) => { const q = tx('readonly').getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const dbPut = rec => new Promise((res, rej) => { const q = tx('readwrite').add(rec); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const dbDel = id => new Promise((res, rej) => { const q = tx('readwrite').delete(id); q.onsuccess = () => res(); q.onerror = () => rej(q.error); });

}

}

    const A = stageAspect(), [sx, sy, sw, sh] = cropRect(A);
    let ow, oh;

    try { if (MediaRecorder.isTypeSupported(t)) return t; } catch (e) {}
  }
  return '';
}
async function startRec() {
  const mime = pickMime();
  if (mime === null) { toast('Bu tarayıcı video kaydını desteklemiyor'); return; }
  if (!vid.videoWidth) return;
  const A = stageAspect(), ow = A >= 1 ? 1440 : Math.round(1440 * A / 2) * 2, oh = A >= 1 ? Math.round(1440 / A / 2) * 2 : 1440;
  const c = el('canvas'); c.width = ow; c.height = oh;
  const x = c.getContext('2d');
  const R = rec = { chunks: [], stop: false, t0: Date.now(), mime, dir: dayFolder(new Date()) + (S.sector ? '/' + sanitize(S.sector) : ''), base: baseName() };
  let last = 0;
  const frame = ts => {
    if (!rec || R.stop) return;
    if (ts - last > 30) {
      last = ts;
      const [sx, sy, sw, sh] = cropRect(A);
      x.drawImage(vid, sx, sy, sw, sh, 0, 0, ow, oh);
      paint(x, ow, oh, buildLines(new Date(), heading));
      if (S.compassPhoto && gotOrientation) paintCompass(x, ow, oh, heading, G.acc, G.alt);
    }
    requestAnimationFrame(frame);
  };
  frame(0);
  const cs = c.captureStream(30);
  if (micStream) micStream.getAudioTracks().forEach(t => cs.addTrack(t));
  try {
    R.mr = new MediaRecorder(cs, mime ? { mimeType: mime, videoBitsPerSecond: 6000000 } : { videoBitsPerSecond: 6000000 });
  } catch (e) { rec = null; toast('Video başlatılamadı: ' + e.message); return; }
  R.mr.ondataavailable = e => { if (e.data && e.data.size) R.chunks.push(e.data); };
  R.mr.onstop = () => finishRec(R);
  R.mr.start(1000);
  $('#shutter').className = 'vid rec';
  const chip = $('#recchip'); chip.style.display = 'block';
  R.timer = setInterval(() => { const t = Math.floor((Date.now() - R.t0) / 1000); chip.textContent = '● ' + pad2(Math.floor(t / 60)) + ':' + pad2(t % 60); }, 250);
  chip.textContent = '● 00:00';
}
function stopRec() { if (!rec) return; rec.stop = true; try { rec.mr.stop(); } catch (e) {} }
async function finishRec(R) {
  clearInterval(R.timer); $('#recchip').style.display = 'none';
  rec = null; $('#shutter').className = mode === 'video' ? 'vid' : '';
  try {
    const type = (R.mr.mimeType || R.mime || 'video/mp4').split(';')[0];
    const blob = new Blob(R.chunks, { type });
    if (!blob.size) throw new Error('boş kayıt');
    const ext = type.includes('mp4') ? 'mp4' : 'webm', n = await nextName(R.dir, R.base), name = `${R.base}_${n}.${ext}`;
    await dbPut({ dir: R.dir, name, blob, ts: Date.now() });
    toast('Video kaydedildi: ' + name);
  } catch (e) { toast('Video kaydedilemedi: ' + (e && e.message || e)); }
}
function onShutter() { if (mode === 'video') { rec ? stopRec() : startRec(); } else shoot(); }

function importLogo(f) {
  if (!f) return;
  const i = new Image(), u = URL.createObjectURL(f);
  i.onload = () => {
    const sc = Math.min(1, 600 / Math.max(i.width, i.height)), c = el('canvas');

    S.logo = c.toDataURL('image/png'); URL.revokeObjectURL(u);
    loadLogo(); save(); render();

}

/* ============ Galeri ============ */
let path = [];
async function renderGallery() {
  const all = await dbAll(), cr = $('#crumbs'), body = $('#galbody');
  cr.innerHTML = ''; body.innerHTML = '';
  const go = n => { path = path.slice(0, n); renderGallery(); };
  cr.append(el('button', { type: 'button', textContent: 'Kayıtlar', onclick: () => go(0) }));
  path.forEach((p, i) => { cr.append(' / '); cr.append(el('button', { type: 'button', textContent: p, onclick: () => go(i + 1) })); });

  const here = path.join('/');
  const inside = all.filter(r => here === '' || r.dir === here || r.dir.startsWith(here + '/'));
  const folders = new Map(), files = [];
  inside.forEach(r => {
    const rest = here === '' ? r.dir : r.dir === here ? '' : r.dir.slice(here.length + 1);
    if (rest === '') files.push(r); else { const f = rest.split('/')[0]; folders.set(f, Math.max(folders.get(f) || 0, r.ts)); }
  });

  const acts = el('div', { className: 'acts' });
  if (inside.length) {
    if (zipPending && zipPending.forPath === here) {
      const mb = (zipPending.blob.size / 1048576).toFixed(1) + ' MB';
      acts.append(el('button', { className: 'btn', textContent: `Paylaş (${mb})`, onclick: doShare }));
      acts.append(el('a', { className: 'btn gray', textContent: 'İndir', href: zipPending.url, download: zipPending.name }));
      acts.append(el('button', { className: 'btn gray', textContent: 'Yeniden hazırla', onclick: () => { zipPending = null; renderGallery(); } }));
    } else {
      const zb = el('button', { className: 'btn', textContent: `Zip hazırla (${inside.length} dosya)` });
      zb.onclick = () => prepareZip(inside, here, path[path.length - 1] || 'Saha-Kamera', zb);
      acts.append(zb);
    }
    acts.append(el('button', { className: 'btn red', textContent: 'Bu klasörü sil', onclick: async () => {
      if (!confirm(`${inside.length} dosya silinsin mi?`)) return;
      for (const r of inside) await dbDel(r.id);
      path = path.slice(0, -1); renderGallery();
    } }));
  } else body.append(el('p', { className: 'note', textContent: 'Burada henüz bir şey yok.' }));
  body.append(acts);

  [...folders.entries()].sort((a, b) => b[1] - a[1]).forEach(([f]) => {
    body.append(el('button', { type: 'button', className: 'item', onclick: () => { path.push(f); renderGallery(); } }, [
      el('div', { className: 'ic', textContent: '📁' }), el('div', { className: 'nm', textContent: f })]));
  });
  files.sort((a, b) => a.ts - b.ts || a.name.localeCompare(b.name)).forEach(r => {
    const isVid = /\.(mp4|webm|mov)$/i.test(r.name);
    const ic = el('div', { className: 'ic', onclick: () => openViewer(r) });
    if (isVid) ic.textContent = '▶'; else ic.append(el('img', { src: URL.createObjectURL(r.blob) }));
    body.append(el('div', { className: 'item' }, [ic,
      el('div', { className: 'nm', onclick: () => openViewer(r) }, [r.name, el('small', { textContent: (r.blob.size / 1048576).toFixed(1) + ' MB' })]),
      el('button', { className: 'x', textContent: '✕', onclick: async () => { if (confirm('Silinsin mi?')) { await dbDel(r.id); renderGallery(); } } })]));
  });
}
async function shareBlob(blob, name, type) {
  const file = new File([blob], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = el('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
}
let zipPending = null;
async function prepareZip(recs, here, name, btn) {
  btn.disabled = true; btn.textContent = 'Zip hazırlanıyor…';
  try {
    const zip = await makeZip(recs.map(r => ({ name: r.dir + '/' + r.name, blob: r.blob })));
    if (zipPending) URL.revokeObjectURL(zipPending.url);
    zipPending = { blob: zip, name: sanitize(name) + '.zip', url: URL.createObjectURL(zip), forPath: here };
    renderGallery();
  } catch (e) {
    toast('Zip hazırlanamadı: ' + (e && e.message || e));
    btn.disabled = false; btn.textContent = 'Zip hazırla';
  }
}
// iPhone paylaşım menüsü dokunuşun hemen içinde açılmalı: bu fonksiyonda await'ten önce hiçbir bekleme yok
function doShare() {
  const f = new File([zipPending.blob], zipPending.name, { type: 'application/zip' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    navigator.share({ files: [f] }).catch(e => { if (!e || e.name !== 'AbortError') toast('Paylaşım açılamadı. "İndir" düğmesini dene.'); });
  } else {
    toast('Bu cihaz dosya paylaşımını desteklemiyor. "İndir" düğmesini kullan.');
  }
}
let viewing = null;
function openViewer(r) {
  viewing = r;
  const vv = $('#vvid'), vi = $('#vimg'), u = URL.createObjectURL(r.blob);
  if (/\.(mp4|webm|mov)$/i.test(r.name)) { vi.style.display = 'none'; vv.style.display = 'block'; vv.src = u; vv.play().catch(() => {}); }
  else { vv.pause(); vv.style.display = 'none'; vi.style.display = 'block'; vi.src = u; }
  $('#viewer').classList.add('open');
}
$('#vclose').onclick = () => { $('#vvid').pause(); $('#viewer').classList.remove('open'); };
$('#vshare').onclick = () => viewing && shareBlob(viewing.blob, viewing.name, viewing.blob.type || 'image/jpeg');

/* ============ Başlatma ============ */
$('#tagbtn').onclick = () => { renderTags(); openSheet('#tagsheet'); };
$('#setbtn').onclick = () => { render(); openSheet('#setsheet'); };
$('#galbtn').onclick = () => {
  path = []; openSheet('#galsheet');
  $('#galbody').textContent = 'Yükleniyor…';
  renderGallery().catch(e => { $('#galbody').textContent = 'Kayıtlar açılamadı: ' + (e && e.message || e); });
};
$('#shutter').onclick = onShutter;
$('#arbtn').onclick = () => { if (rec) return; const k = Object.keys(ASP); S.aspect = k[(k.indexOf(S.aspect) + 1) % k.length]; save(); };
$('#mvid').onclick = () => setMode('video');
$('#mpho').onclick = () => setMode('photo');

const needsGesture = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
let compassOn = false, compassBusy = false, booting = false, booted = false;
async function ensureCompass() {
  if (compassOn || compassBusy) return;
  compassBusy = true;
  const r = await startCompass();
  compassBusy = false;
  if (r === 'granted') compassOn = true;
  else if (r === 'denied') {
    compassOn = true;
    toast('Pusula izni reddedildi. Uygulamayı tamamen kapatıp aç ve "İzin Ver"i seç.');
  }
}
function showStart(msg) { $('#starterr').textContent = msg; $('#start').style.display = 'flex'; }
async function boot() {
  if (booting || booted) return;
  booting = true;
  try {
    if (location.protocol === 'file:' || !window.isSecureContext) {
      showStart('Bu dosya doğrudan açılamaz. Uygulamanın https:// ile başlayan web adresinden açılması gerekir.'); return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStart('Bu tarayıcı kamerayı desteklemiyor. Safari ile aç.'); return;
    }
    if (!needsGesture) ensureCompass();          // iPhone dışında izin gerekmez; iPhone'da ilk dokunuşta açılır
    startGeo();
    try { await openDB(); } catch (e) { showStart('Depolama açılamadı (özel gezinme kapalı olmalı).'); return; }
    try {
      await openCamera();
      await findLenses();
    } catch (e) {
      showStart('Kamera açılamadı. Safari Ayarları > Kamera bölümünden izin ver, sonra Başlat\'a dokun.'); return;
    }
    $('#start').style.display = 'none';
    loadLogo(); renderZoom(); drawOverlay();
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
    const all = await dbAll();
    if (all.length) { const last = all.filter(r => r.name.endsWith('.jpg') && !r.name.endsWith('_temiz.jpg')).pop(); if (last) setThumb(last.blob); }
    booted = true;
    loop();
  } finally { booting = false; }
}
applyAspect();
function loop() { drawStrip(); updateBar(); requestAnimationFrame(loop); }
setInterval(drawOverlay, 1000);
addEventListener('resize', drawOverlay);
addEventListener('orientationchange', () => setTimeout(drawOverlay, 350));
if (window.ResizeObserver) new ResizeObserver(() => drawOverlay()).observe($('#stage'));
addEventListener('error', e => toast('Hata: ' + e.message));
addEventListener('unhandledrejection', e => toast('Hata: ' + ((e.reason && e.reason.message) || e.reason)));
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && stream && (!track || track.readyState === 'ended')) { try { await openCamera(lenses[lens]); renderZoom(); } catch (e) {} }
});
$('#go').onclick = () => { if (needsGesture) ensureCompass(); boot(); };
['click', 'touchend'].forEach(ev => document.addEventListener(ev, () => { if (needsGesture && !compassOn) ensureCompass(); }, true));
boot();
